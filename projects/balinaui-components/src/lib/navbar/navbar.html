<header class="anv-navbar">
  <div class="anv-topbar"></div>
  <div class="anv-stripes">
    <div class="anv-content">
      <div class="anv-brand">
        <img [src]="image"
         [alt]="Aerologo"
         class="anv-brand-icon" >
      </div>

      <nav class="anv-links">
        <a *ngFor="let link of links" href="#" class="anv-link">{{ link }}</a>
      </nav>

      <div class="anv-actions">
        <button class="anv-icon-btn" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
          </svg>
        </button>

        <span class="anv-divider"></span>

        <button *ngIf="!isLoggedIn" class="anv-login-btn" (click)="handleLoginClick()">
          Login
        </button>

        <div *ngIf="isLoggedIn" class="anv-profile-wrap">
          <button
            class="anv-profile-btn"
            (click)="handleProfileClick()"
            [attr.aria-expanded]="isDropdownOpen"
            aria-haspopup="true"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </button>

          <div *ngIf="isDropdownOpen" class="anv-dropdown">
            <div class="anv-dropdown-header">
              <div class="anv-dropdown-avatar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <div class="anv-dropdown-info">
                <span class="anv-dropdown-name">{{ userName }}</span>
                <span class="anv-dropdown-email">{{ userEmail }}</span>
              </div>
            </div>
            <hr class="anv-dropdown-sep" />
            <button class="anv-dropdown-item anv-logout" (click)="handleLogoutClick()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
