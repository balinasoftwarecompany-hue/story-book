<header class="anv-navbar">

  <!--TOP STRIPE-->
  <div class="anv-topbar"></div>
  <!--NAVBAR-->
  <div class="anv-stripes">
    <div class="anv-content">

      <!--BRAND / LOGO-->
        <img *ngIf="image" [src]="image" [alt]="logoAlt" class="anv-brand-icon" />
        <span *ngIf="brand" class="anv-brand-name">
          {{ brand }}
        </span>

      <!--NAVIGATION LINKS-->
      <nav class="anv-links" aria-label="Main navigation">
        <a *ngFor="let link of links" [routerLink]="link.url" routerLinkActive="anv-link-active"
          [routerLinkActiveOptions]="{ exact: true }" class="anv-link">
          {{ link.label }}
        </a>
      </nav>


      <!--ACTIONS-->
      <div class="anv-actions">
        <!--NOTIFICATION-->
        <button type="button" class="anv-icon-btn" aria-label="Notifications">
          <span class="material-icons">
            {{ notificationIcon }}
          </span>
        </button>

        
        <!--DIVIDER-->
        <span class="anv-divider"></span>

        <!--LOGIN-->
        <button *ngIf="!isLoggedIn" type="button" class="anv-login-btn" (click)="handleLoginClick()">
          Login
        </button>

        <!--PROFILE-->
        <div *ngIf="isLoggedIn" class="anv-profile-wrap">

          <!-- PROFILE BUTTON -->
          <button type="button" class="anv-profile-btn" (click)="handleProfileClick()"
            [attr.aria-expanded]="isDropdownOpen" aria-haspopup="true" aria-label="User profile">
            <img *ngIf="user.image" [src]="user.image" [alt]="user.name" class="anv-profile-image" />
            <span *ngIf="!user.image" class="material-icons">
              {{ profileIcon }}
            </span>
            
          </button>

          <!-- PROFILE DROPDOWN-->

          <div *ngIf="isDropdownOpen" class="anv-dropdown">
            <!-- USER INFORMATION -->
            <div class="anv-dropdown-header">
              <!-- USER IMAGE -->
              <div class="anv-dropdown-avatar">
                <img *ngIf="user.image" [src]="user.image" [alt]="user.name" />
                <span *ngIf="!user.image" class="material-icons">
                  {{ userIcon }}
                </span>
              </div>

              <!-- USER DETAILS -->

              <div class="anv-dropdown-info">
                <span class="anv-dropdown-name">
                  {{ user.name }}
                </span>
                <span class="anv-dropdown-email">
                  {{ user.email }}
                </span>
                <span *ngIf="user.role" class="anv-dropdown-role">
                  {{ user.role }}
                </span>
              </div>
            </div>

            <!-- DIVIDER -->
            <hr class="anv-dropdown-sep">
            <!-- LOGOUT -->
            <button type="button" class="anv-dropdown-item anv-logout" (click)="handleLogoutClick()">
              <span class="material-icons">
                {{ logoutIcon }}
              </span>
              <span>
                Log out
              </span>
            </button>

          </div>
        </div>
      </div>
    </div>
  </div>
</header>
