<div
  class="multi-dropdown"
>
  <button
    type="button"
    class="dropdown-header"
    [disabled]="disabled"
    (click)="toggle($event)"
  >

    <span class="dropdown-label">

      {{ displayText }}

    </span>


    <span
      class="dropdown-arrow"
      [class.arrow-open]="isOpen"
    ></span>

  </button>
  @if (isOpen) {

    <div
      class="dropdown-options"
    >

      @for (
        option of options;
        track option.value
      ) {

        <button
          type="button"
          class="dropdown-option"
          [class.option-selected]="
            isSelected(option)
          "
          [class.option-disabled]="
            option.disabled
          "
          [disabled]="
            disabled ||
            option.disabled
          "
          (click)="
            onOptionClick(
              option,
              $event
            )
          "
        >

          <!-- Checkbox -->

          <span
            class="checkbox"
            [class.checkbox-selected]="
              isSelected(option)
            "
          >

            @if (
              isSelected(option)
            ) {

              <span class="checkmark">
                ✓
              </span>

            }

          </span>


          <!-- Label -->

          <span
            class="option-label"
          >
            {{ option.label }}
          </span>

        </button>

      }

    </div>

  }

</div>
