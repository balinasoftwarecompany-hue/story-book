<div class="multi-dropdown">

  <!-- HEADER -->

  <button
    type="button"
    class="dropdown-header"
    [disabled]="disabled || !clickable"
    (click)="toggle($event)"
  >

    <span class="dropdown-label">
      {{ displayText }}
    </span>


    <span
      class="dropdown-arrow"
      [class.arrow-open]="isOpen"
    ></span>

  </button>


  <!-- OPTIONS -->

  @if (isOpen) {

    <div class="dropdown-options">

      @for (
        option of options;
        track option.value
      ) {

        <button
          type="button"

          class="dropdown-option"

          [class.option-selected]="
            isSelected(option)
          "

          [class.option-disabled]="
            option.disabled
          "

          [disabled]="
            disabled ||
            option.disabled ||
            !clickable
          "

          (click)="
            onOptionClick(
              option,
              $event
            )
          "
        >

          <!-- CHECKBOX -->

          @if (useCheckbox) {

            <span
              class="checkbox"
              [class.checkbox-selected]="
                isSelected(option)
              "
            >

              @if (
                isSelected(option)
              ) {

                <span class="checkmark">
                  ✓
                </span>

              }

            </span>

          }


          <!-- OPTION LABEL -->

          <span class="option-label">
            {{ option.label }}
          </span>

        </button>

      }

    </div>

  }

</div>
