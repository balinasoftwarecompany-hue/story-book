<div
  class="balina-card"

  [class]="customClass"

  [class.card-clickable]="clickable"

  [class.card-disabled]="disabled"

  (click)="onClick($event)"
>

  <!-- =====================================
       TITLE
       ===================================== -->

  <h2 class="card-title">
    {{ title }}
  </h2>


  <!-- =====================================
       CONTENT
       ===================================== -->

  <div class="card-content">

    <!-- ===================================
         DATE
         =================================== -->

    <div class="card-date">

      <div class="card-month">
        {{ month }}
      </div>

      <div class="card-line"></div>

      <div class="card-day">
        {{ day }}
      </div>

    </div>


    <!-- ===================================
         DESCRIPTION
         =================================== -->

    <div class="card-description">

      {{ description }}

    </div>

  </div>

</div>
