<div class="balina-card"
  (click)="onClick($event)">


  <h2 class="card-title">
    {{ title }}
  </h2>


  <div class="card-content">

    <div class="card-date">

      <div class="card-month">
        {{ month }}
      </div>

      <div class="card-line"></div>

      <div class="card-day">
        {{ day }}
      </div>

    </div>


    <div class="card-description">

      {{ description }}

    </div>

  </div>

</div>
