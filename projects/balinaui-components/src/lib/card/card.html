<div class="card mat-elevation-z1" (click)="onCardClick()" role="button" tabindex="0">

  <!-- Title -->
  <h2 class="mat-headline-4 card-title">
    {{ title }}
  </h2>

  <!-- Content -->
  <div class="card-content">

    <!-- Date -->
    <div class="date-box">

      <div class="month mat-title-medium">
        {{ month }}
      </div>

      <div class="day mat-headline-5">
        {{ day }}
      </div>

    </div>

    <!-- Description -->
    <div class="description mat-body-large">
      {{ description }}
    </div>

  </div>

</div>
