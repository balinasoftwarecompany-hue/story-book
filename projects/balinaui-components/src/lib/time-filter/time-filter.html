<div
  class="time-filter"
  [class]="customClass"

  [class.time-filter-clickable]="clickable"

  [class.time-filter-disabled]="disabled"

  [class.time-filter-selected]="selected"

  (click)="onClick($event)"

  role="button"

  tabindex="0"
>

  <!-- =====================================
       RADIO
       ===================================== -->

  <div
    class="radio-circle"
    [class.selected]="selected"
  >

    <div class="radio-dot"></div>

  </div>


  <!-- =====================================
       LABEL
       ===================================== -->

  <span class="label">
    {{ label }}
  </span>

</div>
